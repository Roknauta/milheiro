<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
                xmlns:m="jakarta.faces.composite/resources/milheiro" xmlns:t="http://milheiro.com/jsf"
                template="/WEB-INF/crud.xhtml">
    <ui:param name="controladorCrud" value="#{programaFidelidadeController}"/>
    <ui:param name="pagina" value="#{msg['interface.programas']}"/>
    <ui:param name="tituloFormulario" value="#{msg['interface.programas.de.fidelidade']}"/>
    <ui:param name="registroEmEdicao" value="#{programaFidelidadeController.programaFidelidade.id != null}"/>
    <ui:define name="titulo"> #{msg['interface.programas.de.fidelidade']} </ui:define>
    <ui:param name="formularioId" value="cadastro"/>
    <ui:define name="editField">
        <p:panelGrid columns="2" layout="grid" styleClass="form-grid">
            <m:inputText id="nome" label="#{msg['interface.nome.do.programa']}" value="#{programaFidelidadeController.programaFidelidade.nome}" required="true" maxlength="80"/>
            <m:selectOneMenu id="categoria" value="#{programaFidelidadeController.programaFidelidade.categoria}" label="#{msg['interface.categoria']}">
                <f:selectItem itemLabel="#{msg['interface.pontos']}" itemValue="PONTOS"/>
                <f:selectItem itemLabel="#{msg['interface.milhas']}" itemValue="MILHAS"/>
            </m:selectOneMenu>
            <m:selectBooleanButton id="ativo" value="#{programaFidelidadeController.programaFidelidade.ativo}" label="#{msg['interface.ativo']}"/>
        </p:panelGrid>
    </ui:define>
    <ui:define name="resultados">
        <p:panel rendered="#{not programaFidelidadeController.editando and programaFidelidadeController.pesquisaRealizada}" header="#{msg['crud.resultados']}">
            <h:outputText value="#{msg['interface.programas.cadastrados']}"/>
            <p:dataTable id="registros" rendered="#{programaFidelidadeController.pesquisaRealizada}" showGridlines="true" value="#{programaFidelidadeController.programasEncontrados}"
                         emptyMessage="#{msg['interface.nenhum.programa.cadastrado']}" reflow="true" var="item" paginatorPosition="bottom">
                <p:column headerText="#{msg['interface.opcoes']}" styleClass="coluna-opcoes">
                    <m:rowActions id="acoes" edit="#{programaFidelidadeController.editar(item)}" remove="#{programaFidelidadeController.excluir(item)}" disabled="false" removeLabel="#{msg['interface.excluir']}"
                                  confirmHeader="#{msg['interface.excluir.registro']}" confirmMessage="#{msg['interface.confirma.esta.acao']}"/>
                </p:column>
                <t:column headerText="#{msg['interface.nome']}" sortBy="#{item.nome}" filterBy="#{item.nome}" filterMatchMode="contains" value="#{item.nome}"/>
                <t:column headerText="#{msg['interface.categoria']}" value="#{item.categoria}"/>
                <t:column headerText="#{msg['interface.status']}" value="#{item.ativo ? msg['interface.ativo'] : msg['interface.inativo.2']}"/>
            </p:dataTable>
        </p:panel>
    </ui:define>
    <ui:define name="salvar">
        <p:commandButton value="#{msg['interface.salvar.programa']}" icon="pi pi-save" action="#{programaFidelidadeController.salvar}" update=":conteudoCrud" process="@form" id="salvar"/>
    </ui:define>
</ui:composition>
