<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:m="jakarta.faces.composite/resources/milheiro" xmlns:t="http://milheiro.com/jsf"
                template="/WEB-INF/crud.xhtml">
    <ui:param name="crudController" value="#{programaFidelidadeController}"/>
    <ui:param name="formId" value="programaFidelidadeEditForm"/>
    <ui:define name="searchField">
        <m:inputText id="filtroNome" label="#{msg['interface.nome.do.programa']}" value="#{programaFidelidadeController.searchForm.nome}"/>
        <m:selectOneMenu id="filtroCategoria" label="#{msg['interface.categoria']}" value="#{programaFidelidadeController.searchForm.categoria}">
            <f:selectItem itemLabel="#{msg['crud.todas.categorias']}" itemValue="#{null}" noSelectionOption="true"/>
            <f:selectItem itemLabel="#{msg['interface.pontos']}" itemValue="PONTOS"/>
            <f:selectItem itemLabel="#{msg['interface.milhas']}" itemValue="MILHAS"/>
        </m:selectOneMenu>
    </ui:define>
    <ui:define name="editField">
        <p:panelGrid columns="2" layout="grid" styleClass="form-grid">
            <m:inputText id="nome" label="#{msg['interface.nome.do.programa']}" value="#{programaFidelidadeController.editForm.nome}" required="true"
                         maxlength="80"/>
            <m:selectOneMenu id="categoria" value="#{programaFidelidadeController.editForm.categoria}" label="#{msg['interface.categoria']}">
                <f:selectItem itemLabel="#{msg['interface.pontos']}" itemValue="PONTOS"/>
                <f:selectItem itemLabel="#{msg['interface.milhas']}" itemValue="MILHAS"/>
            </m:selectOneMenu>
            <m:selectBooleanButton id="ativo" value="#{programaFidelidadeController.editForm.ativo}" label="#{msg['interface.ativo']}"/>
        </p:panelGrid>
    </ui:define>
    <ui:define name="resultados">
        <p:dataTable id="registros" rendered="#{programaFidelidadeController.pesquisaRealizada}" showGridlines="true"
                     value="#{programaFidelidadeController.result}"
                     emptyMessage="#{msg['interface.nenhum.programa.cadastrado']}" reflow="true" var="item" paginatorPosition="bottom">
            <p:column headerText="#{msg['interface.opcoes']}" styleClass="coluna-opcoes">
                <m:rowActions id="acoes" edit="#{programaFidelidadeController.edit(item.id)}" remove="#{programaFidelidadeController.delete(item.id)}"
                              disabled="false" removeLabel="#{msg['interface.excluir']}"
                              confirmHeader="#{msg['interface.excluir.registro']}" confirmMessage="#{msg['interface.confirma.esta.acao']}"/>
            </p:column>
            <t:column headerText="#{msg['interface.nome']}" value="#{item.nome}"/>
            <t:column headerText="#{msg['interface.categoria']}" value="#{item.categoria}"/>
            <t:column headerText="#{msg['interface.status']}" value="#{item.ativo ? msg['interface.ativo'] : msg['interface.inativo.2']}"/>
        </p:dataTable>
    </ui:define>
</ui:composition>
