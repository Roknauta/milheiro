<ui:composition xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html"
    xmlns:p="http://primefaces.org/ui" xmlns:f="jakarta.faces.core"
    xmlns:m="jakarta.faces.composite/resources/milheiro" xmlns:t="http://milheiro.com/jsf"
    template="/WEB-INF/crud.xhtml">
    <ui:param name="controladorCrud" value="#{estornoController}"/>
    <ui:param name="formularioId" value="movimentos"/>
    <ui:param name="tituloFormulario" value="#{msg['operacao.estornos']}"/>
    <ui:define name="titulo">#{msg['operacao.estornos']}</ui:define>
    <ui:define name="descricao">#{msg['operacao.tela.descricao']}</ui:define>
    <ui:define name="novo">
        <p:commandButton id="novo" value="#{msg['interface.novo']}" icon="pi pi-plus"
            action="#{estornoController.novo}" process="@this" update=":conteudoCrud" resetValues="true"/>
    </ui:define>
    <ui:define name="formulario">
        <h:panelGroup layout="block" styleClass="crud-fields">
            <m:datePicker id="data" value="#{estornoController.operacao.data}" pattern="dd/MM/yyyy"
                label="#{msg['interface.data.2']}" required="true"/>
            <m:selectOneMenu id="original" value="#{estornoController.operacao.operacaoOriginalId}"
                label="#{msg['estorno.operacao.original']}" required="true">
                <f:selectItem itemLabel="#{msg['interface.selecione']}" itemValue="#{null}" noSelectionOption="true"/>
                <f:selectItems value="#{estornoController.operacoesEstornaveis}" var="o" itemValue="#{o.id}"
                    itemLabel="#{o.id} - #{o.tipo.descricao} - #{o.programa.nome} - #{o.data}"/>
                <p:ajax listener="#{estornoController.selecionarOriginal}" process="@this"
                    update=":movimentos:resumoEstorno"/>
            </m:selectOneMenu>
        </h:panelGroup>
        <p:outputPanel id="resumoEstorno">
            <p:panel rendered="#{estornoController.operacaoOriginal != null}" header="#{msg['estorno.resumo']}"
                styleClass="transfer-summary operation-summary">
                <h:panelGroup layout="block" styleClass="summary-row">
                    <h:outputText value="#{msg['interface.quantidade.2']}" styleClass="summary-label"/>
                    <h:outputText value="#{estornoController.operacaoOriginal.quantidade}"
                        converter="quantidadeConverter" styleClass="summary-value"/>
                </h:panelGroup>
                <h:panelGroup layout="block" styleClass="summary-row">
                    <h:outputText value="#{msg['interface.valor.custo.proporcional.r']}" styleClass="summary-label"/>
                    <h:outputText value="#{estornoController.operacaoOriginal.valor}"
                        converter="monetarioConverter" styleClass="summary-value"/>
                </h:panelGroup>
            </p:panel>
        </p:outputPanel>
        <h:outputText value="#{msg['estorno.orientacao']}" styleClass="summary-note"/>
        <m:inputTextarea id="observacoes" value="#{estornoController.operacao.observacoes}"
            label="#{msg['interface.observacoes']}" maxlength="500" rows="2" autoResize="true"/>
    </ui:define>
    <ui:define name="salvar">
        <p:commandButton id="salvar" value="#{msg['interface.salvar.operacao']}" icon="pi pi-save"
            action="#{estornoController.salvar}" process="@form" update=":conteudoCrud"/>
    </ui:define>
    <ui:define name="resultados">
        <p:panel rendered="#{estornoController.pesquisaRealizada and not estornoController.editando}"
            header="#{msg['operacao.estornos']}">
            <h:outputText value="#{msg['operacao.status.orientacao']}" styleClass="summary-note"/>
            <p:dataTable id="registros" value="#{estornoController.registrosEncontrados}" var="item"
                paginator="true" rows="15" paginatorPosition="bottom" paginatorAlwaysVisible="false"
                showGridlines="true" reflow="true" rowStyleClass="#{item.cancelada ? 'cancelled' : ''}"
                emptyMessage="#{msg['interface.nenhuma.operacao.comece.cadastrando.seus.programas.e.saldos.iniciais.como.acum']}">
                <p:column headerText="#{msg['interface.opcoes']}" style="width: 5rem; text-align: center;">
                    <ui:include src="/WEB-INF/operacoes/status.xhtml"/>
                </p:column>
                <t:column headerText="#{msg['operacao.numero']}" value="#{item.id}"/>
                <t:column headerText="#{msg['interface.data.2']}" value="#{item.data}">
                    <f:convertDateTime type="localDate" pattern="dd/MM/yyyy"/>
                </t:column>
                <t:column headerText="#{msg['interface.status']}" value="#{item.status.descricao}"/>
                <t:column headerText="#{msg['interface.programa']}" value="#{item.programa.nome}"/>
                <t:column headerText="#{msg['estorno.operacao.original']}" value="#{item.operacaoOriginal.id}"/>
                <t:column headerText="#{msg['interface.operacao']}" value="#{item.operacaoOriginal.tipo.descricao}"/>
                <t:column headerText="#{msg['interface.quantidade.2']}" value="#{item.quantidade}" converter="quantidadeConverter"/>
                <t:column headerText="#{msg['interface.valor.custo.proporcional.r']}" value="#{item.valor}" converter="monetarioConverter"/>
                <t:column headerText="#{msg['operacao.desembolso']}" value="#{item.desembolso}" converter="monetarioConverter"/>
                <t:column headerText="#{msg['interface.observacoes']}" value="#{item.observacoes}"/>
            </p:dataTable>
        </p:panel>
    </ui:define>
</ui:composition>
