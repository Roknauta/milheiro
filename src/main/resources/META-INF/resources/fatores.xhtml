<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
                xmlns:m="jakarta.faces.composite/resources/milheiro" xmlns:t="http://milheiro.com/jsf"
                template="/WEB-INF/crud.xhtml">
    <ui:param name="pagina" value="#{msg['interface.fatores']}"/>
    <ui:param name="tituloFormulario" value="#{carteira.fator.id == null ? msg['interface.novo.fator'] : msg['interface.editar.fator']}"/>
    <ui:define name="titulo"> #{msg['interface.fatores.de.conversao']} </ui:define>
    <ui:define name="descricao"> #{msg['fator.descricao']} </ui:define>
    <ui:param name="formularioId" value="cadastro"/>
    <ui:define name="novo">
        <p:commandButton id="novo" value="#{msg['interface.novo']}" icon="pi pi-plus" action="#{carteira.novoFator}" process="@this" update=":conteudoCrud" resetValues="true"/>
    </ui:define>
    <ui:define name="formulario">
        <h:panelGroup styleClass="crud-fields" layout="block">
            <m:selectOneMenu id="origem" value="#{carteira.origemFator}" required="true" label="#{msg['interface.programa.de.origem']}">
                <f:selectItem itemLabel="#{msg['interface.selecione']}" itemValue="#{null}" noSelectionOption="true"/>
                <f:selectItems value="#{carteira.programasAtivos}" var="p" itemValue="#{p.id}" itemLabel="#{p.nome}"/>
            </m:selectOneMenu>
            <m:selectOneMenu id="destino" value="#{carteira.destinoFator}" required="true" label="#{msg['interface.programa.de.destino']}">
                <f:selectItem itemLabel="#{msg['interface.selecione']}" itemValue="#{null}" noSelectionOption="true"/>
                <f:selectItems value="#{carteira.programasAtivos}" var="p" itemValue="#{p.id}" itemLabel="#{p.nome}"/>
            </m:selectOneMenu>
            <m:inputNumber id="pontosOrigem" value="#{carteira.fator.pontosOrigem}" required="true" label="#{msg['interface.pontos.na.origem']}" decimalPlaces="3" decimalSeparator=","
                           thousandSeparator="." minValue="0.001" maxValue="999999999999"/>
            <m:inputNumber id="pontosDestino" value="#{carteira.fator.pontosDestino}" required="true" label="#{msg['interface.pontos.no.destino']}" decimalPlaces="3" decimalSeparator=","
                           thousandSeparator="." minValue="0.001" maxValue="999999999999"/>
        </h:panelGroup>
        <h:panelGroup style="display: block; margin: 1rem 0;"
                      layout="block"> #{msg['interface.exemplo.3.5.pontos.na.origem.para.1.ponto.no.destino.equivale.ao.fator.1.3.5.o']}
        </h:panelGroup>
    </ui:define>
    <ui:define name="resultados">
        <p:panel rendered="#{not carteira.editando and carteira.pesquisaRealizada}" style="margin-bottom: 1rem; min-width: 0;">
            <h:outputText style="display: block; font-size: 1.1rem; font-weight: 600; margin: 1rem 0;" value="#{msg['interface.conversoes.cadastradas']}"/>
            <p:dataTable id="registros" rendered="#{carteira.pesquisaRealizada}" showGridlines="true" value="#{carteira.fatoresEncontrados}"
                         emptyMessage="#{msg['interface.nenhum.fator.cadastrado']}" reflow="true" var="item" paginatorPosition="bottom">
                <p:column headerText="#{msg['interface.opcoes']}" style="width: 5rem;">
                    <m:rowActions id="acoes" edit="#{carteira.editarFator(item)}" remove="#{carteira.excluirFator(item)}" disabled="false" removeLabel="#{msg['interface.excluir']}"
                                  confirmHeader="#{msg['interface.excluir.registro']}" confirmMessage="#{msg['interface.confirma.esta.acao']}"/>
                </p:column>
                <t:column headerText="#{msg['interface.origem']}" value="#{item.origem.nome}"/>
                <t:column headerText="#{msg['interface.destino.2']}" value="#{item.destino.nome}"/>
                <t:column headerText="#{msg['interface.pontos.origem']}" value="#{item.pontosOrigem}" converter="decimalConverter"/>
                <t:column headerText="#{msg['interface.pontos.destino']}" value="#{item.pontosDestino}" converter="decimalConverter"/>
            </p:dataTable>
        </p:panel>
    </ui:define>
    <ui:define name="salvar">
        <p:commandButton value="#{msg['interface.salvar.fator']}" icon="pi pi-save" action="#{carteira.salvarFator}" update=":conteudoCrud" process="@form" id="salvar"/>
    </ui:define>
</ui:composition>
