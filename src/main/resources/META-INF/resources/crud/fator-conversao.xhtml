<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
                xmlns:m="jakarta.faces.composite/resources/components" xmlns:t="http://milheiro.com/jsf"
                template="/layout/crud.xhtml">
    <ui:param name="crudController" value="#{fatorConversaoController}"/>
    <ui:define name="titulo"> #{msg['interface.fatores.de.conversao']} </ui:define>
    <ui:param name="formId" value="fatorConversaoEditForm"/>
    <ui:define name="searchField">
        <m:inputText id="filtro" label="#{msg['interface.pesquisar.por.programa.tipo.ou.descricao']}" value="#{fatorConversaoController.searchForm.filtro}"/>
    </ui:define>
    <ui:define name="editField">
        <p:panelGrid columns="2" layout="grid" styleClass="form-grid">
            <m:programaFidelidadeAutoComplete id="origem" value="#{fatorConversaoController.editForm.origemId}" required="true" label="#{msg['interface.programa.de.origem']}">
            </m:programaFidelidadeAutoComplete>
            <m:programaFidelidadeAutoComplete id="destino" value="#{fatorConversaoController.editForm.destinoId}" required="true" label="#{msg['interface.programa.de.destino']}">
            </m:programaFidelidadeAutoComplete>
            <m:inputNumber id="pontosOrigem" value="#{fatorConversaoController.editForm.pontosOrigem}" required="true" label="#{msg['interface.pontos.na.origem']}" decimalPlaces="3" decimalSeparator=","
                           thousandSeparator="." minValue="0.001" maxValue="999999999999"/>
            <m:inputNumber id="pontosDestino" value="#{fatorConversaoController.editForm.pontosDestino}" required="true" label="#{msg['interface.pontos.no.destino']}" decimalPlaces="3" decimalSeparator=","
                           thousandSeparator="." minValue="0.001" maxValue="999999999999"/>
        </p:panelGrid>
        <h:panelGroup
                      layout="block"> #{msg['interface.exemplo.3.5.pontos.na.origem.para.1.ponto.no.destino.equivale.ao.fator.1.3.5.o']}
        </h:panelGroup>
    </ui:define>
    <ui:define name="resultados">
        <p:dataTable id="registros" rendered="#{fatorConversaoController.pesquisaRealizada}" showGridlines="true" value="#{fatorConversaoController.result}"
                     emptyMessage="#{msg['interface.nenhum.fator.cadastrado']}" reflow="true" var="item" paginatorPosition="bottom">
            <p:column headerText="#{msg['interface.opcoes']}" styleClass="coluna-opcoes">
                <m:rowActions id="acoes" edit="#{fatorConversaoController.edit(item.id)}" remove="#{fatorConversaoController.delete(item.id)}" disabled="false" removeLabel="#{msg['interface.excluir']}"
                              confirmHeader="#{msg['interface.excluir.registro']}" confirmMessage="#{msg['interface.confirma.esta.acao']}"/>
            </p:column>
            <t:column headerText="#{msg['interface.origem']}" value="#{item.origem.nome}"/>
            <t:column headerText="#{msg['interface.destino.2']}" value="#{item.destino.nome}"/>
            <t:column headerText="#{msg['interface.pontos.origem']}" value="#{item.pontosOrigem}" converter="decimalConverter"/>
            <t:column headerText="#{msg['interface.pontos.destino']}" value="#{item.pontosDestino}" converter="decimalConverter"/>
        </p:dataTable>
    </ui:define>
</ui:composition>
