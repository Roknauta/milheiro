<ui:composition xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui" xmlns:f="jakarta.faces.core"
                xmlns:m="jakarta.faces.composite/resources/components" xmlns:t="http://milheiro.com/jsf" xmlns:fn="jakarta.tags.functions"
                template="/layout/crud.xhtml">
    <ui:param name="crudController" value="#{acumuloController}"/>
    <ui:param name="formId" value="movimentos"/>
    <ui:define name="titulo">#{msg['operacao.acumulo']}</ui:define>
    <ui:define name="searchField">
        <m:inputText id="filtro" label="#{msg['interface.pesquisar.por.programa.tipo.ou.descricao']}" value="#{acumuloController.searchForm.filtro}"/>
    </ui:define>
    <ui:define name="editField">
        <p:panelGrid columns="2" layout="grid" styleClass="form-grid">
            <m:datePicker id="data" value="#{acumuloController.editForm.data}" label="#{msg['interface.data.2']}"
                          pattern="dd/MM/yyyy" required="true"/>
            <m:programaFidelidadeAutoComplete id="programa" value="#{acumuloController.editForm.programaId}"
                                              label="#{msg['interface.programa']}" required="true"/>
            <m:inputNumber id="quantidade" value="#{acumuloController.editForm.quantidade}"
                           label="#{msg['interface.quantidade.de.pontos']}" required="true" decimalPlaces="0"
                           decimalSeparator="," thousandSeparator="." minValue="1" maxValue="999999999999"/>
            <m:inputNumber id="valor" value="#{acumuloController.editForm.valor}"
                           label="#{msg['interface.valor.total.pago.r']}" required="true" decimalPlaces="2"
                           decimalSeparator="," thousandSeparator="." minValue="0" maxValue="999999999999"/>
        </p:panelGrid>
        <h:outputText value="#{msg['interface.informe.o.valor.total.pago.ja.incluindo.eventuais.taxas']}"/>
        <m:inputTextarea id="observacoes" value="#{acumuloController.editForm.observacoes}"
                         label="#{msg['interface.observacoes']}" maxlength="500" rows="2" autoResize="true"/>
    </ui:define>
    <ui:define name="resultados">
        <p:dataTable id="registros" value="#{acumuloController.result}" var="item"
                     paginator="true" rows="15" paginatorPosition="top" paginatorAlwaysVisible="false"
                     showGridlines="true" reflow="true" rendered="#{acumuloController.pesquisaRealizada and not acumuloController.editing}"
                     emptyMessage="#{msg['interface.nenhuma.operacao.comece.cadastrando.seus.programas.e.saldos.iniciais.como.acum']}">
            <p:column headerText="#{msg['interface.opcoes']}" styleClass="coluna-opcoes">
                <ui:include src="/crud/operacoes/status.xhtml"/>
            </p:column>
            <t:column headerText="#{msg['operacao.numero']}" value="#{item.id}"/>
            <t:column headerText="#{msg['interface.data.2']}" value="#{item.data}">
                <f:convertDateTime type="localDate" pattern="dd/MM/yyyy"/>
            </t:column>
            <t:column headerText="#{msg['interface.status']}" value="#{item.status.descricao}"/>
            <t:column headerText="#{msg['interface.programa']}" value="#{item.programa.nome}"/>
            <t:column headerText="#{msg['operacao.vinculo']}" value="#{item.vinculoTransferencia}"/>
            <t:column headerText="#{msg['operacao.parcela']}" value="#{item.parcelaDescricao}"/>
            <t:column headerText="#{msg['interface.quantidade.2']}" value="#{item.quantidade}" converter="quantidadeConverter"/>
            <t:column headerText="#{msg['interface.valor.total.pago.r']}" value="#{item.valor}" converter="monetarioConverter"/>
            <t:column headerText="#{msg['interface.observacoes']}" value="#{item.observacoes}"/>
            <f:facet name="footer">
                <h:outputText value="#{msg['crud.registros.encontrados']} #{fn:length(acumuloController.result)}"/>
            </f:facet>
        </p:dataTable>
    </ui:define>
</ui:composition>
