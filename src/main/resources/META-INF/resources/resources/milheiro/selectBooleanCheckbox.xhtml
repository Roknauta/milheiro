<ui:component xmlns:ui="jakarta.faces.facelets" xmlns:cc="jakarta.faces.composite" xmlns:p="http://primefaces.org/ui" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:m="jakarta.faces.composite/milheiro" xmlns:t="http://milheiro.com/jsf" xmlns:pt="jakarta.faces.passthrough">
    <cc:interface>
        <cc:attribute name="value" required="true"/>
        <cc:attribute name="label" default=""/>
        <cc:attribute name="required" type="java.lang.Boolean" default="false"/>
        <cc:attribute name="disabled" type="java.lang.Boolean" default="false"/>
        <cc:attribute name="readonly" type="java.lang.Boolean" default="false"/>
        <cc:attribute name="requiredMessage" default="#{msg['componente.obrigatorio']}"/>
        <cc:attribute name="itemLabel" default=""/>
        <cc:editableValueHolder name="input" targets="input"/>
        <cc:clientBehavior name="valueChange" event="valueChange" targets="input" default="true"/>
        <cc:clientBehavior name="change" event="change" targets="input"/>
    </cc:interface>
    <cc:implementation>
        <h:panelGroup layout="block" style="display: flex; flex-direction: column; gap: .25rem; min-width: 0; max-width: 100%;">
            <p:outputLabel for="input" value="#{cc.attrs.label}" rendered="#{not empty cc.attrs.label}"/>
            <p:selectBooleanCheckbox id="input" value="#{cc.attrs.value}" disabled="#{cc.attrs.disabled}" itemLabel="#{cc.attrs.itemLabel}"/>
            <p:message for="input"/>
        </h:panelGroup>
    </cc:implementation>
</ui:component>
