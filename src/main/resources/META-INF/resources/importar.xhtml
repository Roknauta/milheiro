<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui" xmlns:h="jakarta.faces.html"
                xmlns:m="jakarta.faces.composite/resources/components"
                xmlns:pt="jakarta.faces.passthrough" template="/layout/template.xhtml">
    <ui:param name="pagina" value="#{msg['interface.importar']}"/>
    <ui:define name="titulo"> #{msg['interface.importar.de.planilha']} </ui:define>
    <ui:define name="conteudo">
        <p:staticMessage severity="warn" summary="#{msg['planilha.importacao.substituicao']}"/>
        <p:panel header="#{msg['interface.selecionar.planilha']}" styleClass="importacao-painel">
            <h:panelGroup layout="block" styleClass="importacao-introducao">
                <h:outputText value="#{msg['interface.somente.a.primeira.aba.e.as.colunas.a.a.f.sao.consideradas']}"/>
            </h:panelGroup>
            <h:form id="importar" enctype="multipart/form-data">
                <p:panelGrid columns="2" layout="grid" styleClass="form-grid">
                    <m:inputFile id="arquivo" value="#{importacao.arquivo}" required="true"
                                 requiredMessage="#{msg['interface.selecione.uma.planilha.para.importar']}"
                                 label="#{msg['interface.arquivo.excel.xlsx.ate.5.mb']}" accept=".xlsx"/>
                    <h:panelGroup layout="block" styleClass="importacao-modelo">
                        <h:outputText value="#{msg['importacao.modelo.orientacao']}"/>
                        <p:button value="#{msg['interface.download.de.modelo']}" icon="pi pi-download"
                                  href="#{request.contextPath}/modelo-importacao.xlsx"/>
                    </h:panelGroup>
                </p:panelGrid>
                <h:panelGroup layout="block" styleClass="crud-footer">
                    <p:commandButton value="#{msg['interface.selecionar.e.importar']}" icon="pi pi-upload"
                                     action="#{importacao.importar}" ajax="false"/>
                </h:panelGroup>
            </h:form>
            <h:panelGroup rendered="#{importacao.resultado != null}" layout="block"
                          styleClass="importacao-resultado" pt:role="status">
                <p:staticMessage severity="info" summary="#{importacao.resultado}"/>
            </h:panelGroup>
        </p:panel>
    </ui:define>
</ui:composition>
