<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui" xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core" xmlns:m="jakarta.faces.composite/resources/milheiro" lang="pt-BR">
<f:view locale="pt_BR">
    <f:event type="preRenderView" listener="#{layoutController.prepararSessao}"/>
    <h:head>
        <title> #{msg['interface.milheiro.2']} <ui:insert name="titulo"/></title>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <h:outputScript library="primefaces" name="locales/locale-pt.js"/>
        <h:outputStylesheet library="css" name="custom.css"/>
        <h:outputStylesheet library="css" name="primefaces-custom.css"/>
    </h:head>
    <h:body styleClass="milheiro-app">
        <p:panelGrid columns="2" layout="grid" styleClass="app-shell">
            <h:panelGroup aria-label="#{msg['interface.menu.principal']}" layout="block" styleClass="app-sidebar">
                <ui:include src="/WEB-INF/navigation.xhtml"/>
            </h:panelGroup>
            <h:panelGroup layout="block" styleClass="app-workspace">
                <p:breadCrumb>
                    <p:menuitem value="#{msg['interface.dashboard']}" outcome="/dashboard"/>
                    <p:menuitem value="#{layoutController.grupoAtual}" rendered="#{not empty layoutController.grupoAtual}" disabled="true"/>
                    <p:menuitem value="#{layoutController.paginaAtual}" rendered="#{not empty layoutController.paginaAtual}" disabled="true"/>
                </p:breadCrumb>
                <p:panel styleClass="page-panel">
                    <f:facet name="header">
                        <ui:insert name="titulo"/>
                    </f:facet>
                    <p:messages id="mensagens" showDetail="false">
                        <p:autoUpdate/>
                    </p:messages>
                    <ui:insert name="conteudo"/>
                </p:panel>
                <!--<h:panelGroup layout="block" styleClass="app-footer"> #{msg['interface.milheiro.controle.de.pontos.e.milhas']}
                </h:panelGroup>-->
            </h:panelGroup>
        </p:panelGrid>
        <m:confirmation/></h:body>
</f:view>
</html>
