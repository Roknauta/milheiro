<ui:composition xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui"
                xmlns:pt="jakarta.faces.passthrough">
<!--    <p:panel id="navigation" header="#{msg['interface.menu.principal']}">-->
        <p:panelMenu multiple="true">
            <p:menuitem value="#{msg['interface.dashboard']}" outcome="/dashboard" icon="pi pi-chart-bar"
                        styleClass="#{view.viewId eq '/dashboard.xhtml' ? 'menu-atual' : ''}"
                        pt:aria-current="#{view.viewId eq '/dashboard.xhtml' ? 'page' : null}"/>
            <p:submenu label="#{msg['interface.milheiro']}" expanded="true">
                <p:menuitem value="#{msg['interface.importar.de.planilha']}" outcome="/importar" icon="pi pi-file-excel"
                            styleClass="#{view.viewId eq '/importar.xhtml' ? 'menu-atual' : ''}"
                            pt:aria-current="#{view.viewId eq '/importar.xhtml' ? 'page' : null}"/>
            </p:submenu>
            <p:submenu label="#{msg['operacao.menu']}" expanded="true">
                <p:menuitem value="#{msg['operacao.acumulo']}" outcome="/acumulo" icon="pi pi-plus-circle"
                            styleClass="#{view.viewId eq '/acumulo.xhtml' or view.viewId eq '/operacoes.xhtml' or view.viewId eq '/incluir-operacao.xhtml' ? 'menu-atual' : ''}"
                            pt:aria-current="#{view.viewId eq '/acumulo.xhtml' or view.viewId eq '/operacoes.xhtml' or view.viewId eq '/incluir-operacao.xhtml' ? 'page' : null}"/>
                <p:menuitem value="#{msg['operacao.transferencia']}" outcome="/transferencia" icon="pi pi-send"
                            styleClass="#{view.viewId eq '/transferencia.xhtml' ? 'menu-atual' : ''}"
                            pt:aria-current="#{view.viewId eq '/transferencia.xhtml' ? 'page' : null}"/>
                <p:menuitem value="#{msg['operacao.venda']}" outcome="/venda" icon="pi pi-dollar"
                            styleClass="#{view.viewId eq '/venda.xhtml' ? 'menu-atual' : ''}"
                            pt:aria-current="#{view.viewId eq '/venda.xhtml' ? 'page' : null}"/>
                <p:menuitem value="#{msg['operacao.resgate']}" outcome="/resgate" icon="pi pi-ticket"
                            styleClass="#{view.viewId eq '/resgate.xhtml' ? 'menu-atual' : ''}"
                            pt:aria-current="#{view.viewId eq '/resgate.xhtml' ? 'page' : null}"/>
                <p:menuitem value="#{msg['operacao.estorno']}" outcome="/estorno" icon="pi pi-undo"
                            styleClass="#{view.viewId eq '/estorno.xhtml' ? 'menu-atual' : ''}"
                            pt:aria-current="#{view.viewId eq '/estorno.xhtml' ? 'page' : null}"/>
            </p:submenu>
            <p:submenu label="#{msg['interface.calculadora']}" expanded="true">
                <p:menuitem value="#{msg['interface.enviar.2']}" outcome="/enviar" icon="pi pi-send"
                            styleClass="#{view.viewId eq '/enviar.xhtml' ? 'menu-atual' : ''}"
                            pt:aria-current="#{view.viewId eq '/enviar.xhtml' ? 'page' : null}"/>
                <p:menuitem value="#{msg['interface.receber.2']}" outcome="/receber" icon="pi pi-download"
                            styleClass="#{view.viewId eq '/receber.xhtml' ? 'menu-atual' : ''}"
                            pt:aria-current="#{view.viewId eq '/receber.xhtml' ? 'page' : null}"/>
            </p:submenu>
            <p:submenu label="#{msg['interface.cadastros']}" expanded="true">
                <p:menuitem value="#{msg['interface.programas.de.fidelidade']}" outcome="/programa-fidelidade" icon="pi pi-wallet"
                            styleClass="#{view.viewId eq '/programa-fidelidade.xhtml' ? 'menu-atual' : ''}"
                            pt:aria-current="#{view.viewId eq '/programa-fidelidade.xhtml' ? 'page' : null}"/>
                <p:menuitem value="#{msg['interface.fatores.de.conversao']}" outcome="/fatores" icon="pi pi-percentage"
                            styleClass="#{view.viewId eq '/fatores.xhtml' ? 'menu-atual' : ''}"
                            pt:aria-current="#{view.viewId eq '/fatores.xhtml' ? 'page' : null}"/>
            </p:submenu>
        </p:panelMenu>
<!--    </p:panel>-->
</ui:composition>
