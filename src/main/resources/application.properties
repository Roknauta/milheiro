spring.application.name=milheiro
server.address=127.0.0.1
server.port=${PORT:5001}
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
milheiro.hsql.enabled=true
milheiro.hsql.port=${MILHEIRO_HSQL_PORT:9001}
# Prefixo dos arquivos do catálogo, dentro da pasta solicitada.
milheiro.hsql.database-path=${MILHEIRO_DB:/home/douglas/workspace/hsqldb/pessoal/milheiro/milheiro}
milheiro.hsql.database-name=milheiro
spring.datasource.url=jdbc:hsqldb:hsql://127.0.0.1:${milheiro.hsql.port}/${milheiro.hsql.database-name}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
joinfaces.faces.project-stage=Production
joinfaces.primefaces.theme=saga-blue

# Limites da importação de planilhas
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

joinfaces.faces.facelets-libraries=/WEB-INF/milheiro.taglib.xml
